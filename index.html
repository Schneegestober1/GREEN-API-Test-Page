<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREEN API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">

        <h1>GREEN API Test Page</h1>
       
        <div class="content">

            <div class="left">

                <input id="idInstance" placeholder=" Input idInstance">
                <input id="apiToken" placeholder=" Input ApiTokenInstance">

                <button onclick="getSettings()">getSettings</button>
                <button onclick="getStateInstance()">getStateInstance</button>

                <input id="phone" placeholder="Input Phone Number">
                <textarea id="message" placeholder="Type anything"></textarea>

                <button onclick="sendMessage()">sendMessage</button>

                <input id="filePhone" placeholder="Input Phone Number">
                <input id="fileUrl" placeholder="www.site.com">

                <button onclick="sendFileByUrl()">sendFileByUrl</button>

            </div>

            <div class="right">
                <label>Ответ:</label>
                <div class="result-area">
                    <textarea id="result" readonly></textarea>
                </div>
            </div>

        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
